name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          rm -rf build_src
          mkdir -p build_src
          unzip -q "保质期管家_V1.0_状态栏自适应版.zip" -d build_src

          echo "解压后的文件："
          find build_src -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          if [ -f "build_src/settings.gradle.kts" ]; then
            PROJECT_DIR="build_src"
          else
            PROJECT_DIR=$(find build_src -name settings.gradle.kts -type f -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "错误：找不到 settings.gradle.kts"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "找到 Android 工程：$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaoZhiQi-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
